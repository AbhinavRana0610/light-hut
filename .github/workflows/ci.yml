name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./client/package-lock.json

      - run: npm ci

      - name: Vite production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  server:
    name: Verify server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./server/package-lock.json

      - run: npm ci

      - name: Syntax-check all server sources
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: npm test
        run: npm test
